[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grit"
version = "0.1.0"
description = "Git Repository Inspector for Teachers"
readme = "README.md"
authors = [{ name = "Daniel Callegari" }]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
grit = "grit.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["grit"]